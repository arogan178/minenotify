plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

def releaseProperties = new Properties()
file('../../gradle.properties').withInputStream { releaseProperties.load(it) }
version = releaseProperties.getProperty('mod_version')
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.164.0+26.3'
}
def sharedSources = fileTree('../../src/main/java') {
    include 'dev/minenotify/ConfigFile.java', 'dev/minenotify/LocalReceiver.java',
            'dev/minenotify/Settings.java', 'dev/minenotify/Notification.java',
            'dev/minenotify/NotificationHistory.java'
}
sourceSets.test.java.srcDir '../../src/test/java'
compileJava.source(sharedSources)
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of((findProperty('build_java_version') ?: '25').toInteger())
    withSourcesJar()
}
sourcesJar.from(sharedSources)
tasks.withType(JavaCompile).configureEach { options.release = 25 }
jar {
    archiveFileName = "minenotify-${project.version}-mc26.3.jar"
    from('../../LICENSE') { rename { "${it}_minenotify" } }
}
tasks.register('coreCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minenotify.CoreChecks'
    enableAssertions = true
}
test { failOnNoDiscoveredTests = false }
check.dependsOn coreCheck

tasks.register('historyCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minenotify.HistoryChecks'
    enableAssertions = true
}
check.dependsOn historyCheck

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('receiverCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minenotify.ReceiverChecks'
    enableAssertions = true
}
check.dependsOn receiverCheck
