name: Build and bridge checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        target: [legacy, modern]
        include:
          - target: legacy
            java: '21'
          - target: modern
            java: '25'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and Java behavior checks
        shell: bash
        run: |
          if [ '${{ matrix.target }}' = legacy ]; then
            ./gradlew build --console=plain
          else
            ./versions/mc26.2/gradlew -p versions/mc26.2 build --console=plain
          fi
      - name: Check bridge and setup CLI
        shell: bash
        run: |
          python tools/test_bridge.py
          python tools/test_setup.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars-${{ matrix.target }}-${{ matrix.os }}
          path: |
            build/libs/*.jar
            versions/mc26.2/build/libs/*.jar
          if-no-files-found: error
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jars-legacy-ubuntu-latest
          path: .work/legacy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jars-modern-ubuntu-latest
          path: .work/modern
      - name: Collect installable JARs
        run: |
          mkdir -p build/libs versions/mc26.2/build/libs
          find .work/legacy -name '*.jar' -exec cp '{}' build/libs/ \;
          find .work/modern -name '*.jar' -exec cp '{}' versions/mc26.2/build/libs/ \;
      - name: Package and verify release bundles
        run: python tools/test_package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundles
          path: dist/*
          if-no-files-found: error
